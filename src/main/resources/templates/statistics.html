<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${currentCity} + ' - 数据统计'">数据统计</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0"><i class="bi bi-bar-chart text-soft"></i> 天气数据统计</h3>
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>

    <form th:action="@{/weather/statistics/search}" method="get" class="search-bar mb-3">
        <input class="form-control" type="text" name="city" placeholder="输入城市名称" th:value="${currentCity}" required>
        <button class="btn btn-primary" type="submit">查询</button>
    </form>

    <div th:if="${currentCityCode}" class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h4 class="mb-0">
            <i class="bi bi-geo-alt text-soft"></i>
            <span th:text="${currentCity}">北京</span>
            <span class="text-muted small fw-light">· 年度数据</span>
        </h4>
        <form th:action="@{/weather/statistics/search}" method="get" class="d-flex align-items-center gap-2">
            <input type="hidden" name="city" th:value="${currentCity}">
            <label for="yearSelect" class="form-label mb-0 small text-soft">年份</label>
            <select id="yearSelect" name="year" class="form-select form-select-sm" style="width:auto;" onchange="this.form.submit()">
                <option th:each="y : ${years}" th:value="${y}" th:text="${y} + ' 年'" th:selected="${y == year}">2026 年</option>
            </select>
        </form>
    </div>

    <div th:if="${estimated}" class="data-source-note">
        <i class="bi bi-info-circle"></i>
        <span>
            该城市在 <span th:text="${year}">2026</span> 年的实际观测数据仅 <strong th:text="${realDays}">0</strong> 天，
            月度统计由气候常理估算 + 当前 7 天预报补充生成，仅供演示。
        </span>
    </div>

    <div th:if="${statsError}" class="alert-row alert-row--red mb-3">
        <i class="bi bi-exclamation-circle"></i>
        <div class="alert-row__body" th:text="${statsError}">错误</div>
    </div>

    <div th:if="${statistics != null and !statistics.isEmpty()}" class="row">
        <div class="col-12 col-lg-7">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-graph-up icon"></i>月平均温度趋势</h4>
                </div>
                <div id="temperatureChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-12 col-lg-5">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-droplet icon"></i>月降水量</h4>
                </div>
                <div id="precipChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-12 col-lg-5">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-pie-chart icon"></i>天气类型分布</h4>
                </div>
                <div id="weatherTypeChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-12 col-lg-7">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-moisture icon"></i>月平均湿度</h4>
                </div>
                <div id="humidityChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-12">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-table icon"></i>月度统计明细</h4>
                </div>
                <table class="data-table">
                    <thead><tr>
                        <th>月份</th>
                        <th class="text-right">平均温度</th>
                        <th class="text-right">最高</th>
                        <th class="text-right">最低</th>
                        <th class="text-right">平均湿度</th>
                        <th class="text-right">总降水</th>
                        <th class="text-right">晴天</th>
                        <th class="text-right">多云</th>
                        <th class="text-right">雨天</th>
                    </tr></thead>
                    <tbody>
                        <tr th:each="s : ${statistics}">
                            <td th:text="${s.statMonth + ' 月'}">1 月</td>
                            <td class="text-right" th:text="${s.avgTemp != null ? #numbers.formatDecimal(s.avgTemp, 1, 1) + '°' : '--'}">5.2°</td>
                            <td class="text-right text-warm" th:text="${s.maxTemp != null ? #numbers.formatDecimal(s.maxTemp, 1, 1) + '°' : '--'}">30.5°</td>
                            <td class="text-right text-cold" th:text="${s.minTemp != null ? #numbers.formatDecimal(s.minTemp, 1, 1) + '°' : '--'}">-5.2°</td>
                            <td class="text-right" th:text="${s.avgHumidity != null ? #numbers.formatDecimal(s.avgHumidity, 1, 1) + '%' : '--'}">65.0%</td>
                            <td class="text-right" th:text="${s.totalPrecip != null ? #numbers.formatDecimal(s.totalPrecip, 1, 1) + ' mm' : '--'}">50.0 mm</td>
                            <td class="text-right" th:text="${s.sunnyDays != null ? s.sunnyDays : '--'}">15</td>
                            <td class="text-right" th:text="${s.cloudyDays != null ? s.cloudyDays : '--'}">10</td>
                            <td class="text-right" th:text="${s.rainDays != null ? s.rainDays : '--'}">6</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${statistics == null or statistics.isEmpty()}" class="empty-state">
        <i class="bi bi-bar-chart"></i>
        <h4>暂无统计数据</h4>
        <p class="text-muted" th:if="${currentCity}">所选年份 <span th:text="${year}">2026</span> 没有 <span th:text="${currentCity}">北京</span> 的数据</p>
        <p class="text-muted" th:unless="${currentCity}">请在上方搜索城市</p>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    (function () {
        var statistics = /*[[${statistics}]]*/ [];
        if (!statistics || !statistics.length) return;

        var months = [], avgTemps = [], maxTemps = [], minTemps = [], precipData = [], humidityData = [];
        var totalSunny = 0, totalCloudy = 0, totalRain = 0;
        for (var i = 0; i < statistics.length; i++) {
            var s = statistics[i];
            months.push(s.statMonth + '月');
            avgTemps.push(s.avgTemp != null ? parseFloat(s.avgTemp) : null);
            maxTemps.push(s.maxTemp != null ? parseFloat(s.maxTemp) : null);
            minTemps.push(s.minTemp != null ? parseFloat(s.minTemp) : null);
            precipData.push(s.totalPrecip != null ? parseFloat(s.totalPrecip) : 0);
            humidityData.push(s.avgHumidity != null ? parseFloat(s.avgHumidity) : null);
            totalSunny += s.sunnyDays || 0;
            totalCloudy += s.cloudyDays || 0;
            totalRain += s.rainDays || 0;
        }

        var axis = { type: 'category', data: months };
        var yValue = { type: 'value' };
        var grid = { left: 36, right: 16, top: 20, bottom: 30 };

        echarts.init(document.getElementById('temperatureChart')).setOption({
            tooltip: { trigger: 'axis' },
            legend: { bottom: 0, textStyle: { fontSize: 11 } },
            grid: grid,
            xAxis: axis,
            yAxis: yValue,
            series: [
                { name: '平均', type: 'line', data: avgTemps, smooth: true, itemStyle: { color: '#1f5fa8' } },
                { name: '最高', type: 'line', data: maxTemps, smooth: true, itemStyle: { color: '#c0392b' } },
                { name: '最低', type: 'line', data: minTemps, smooth: true, itemStyle: { color: '#2563eb' } }
            ]
        });
        echarts.init(document.getElementById('precipChart')).setOption({
            tooltip: { trigger: 'axis' },
            grid: grid,
            xAxis: axis,
            yAxis: yValue,
            series: [{ type: 'bar', data: precipData, itemStyle: { color: '#1f5fa8' } }]
        });
        echarts.init(document.getElementById('weatherTypeChart')).setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c}天 ({d}%)' },
            legend: { bottom: 0, textStyle: { fontSize: 11 } },
            series: [{
                type: 'pie', radius: ['40%', '70%'],
                data: [
                    { value: totalSunny, name: '晴天', itemStyle: { color: '#f59e0b' } },
                    { value: totalCloudy, name: '多云', itemStyle: { color: '#94a3b8' } },
                    { value: totalRain, name: '雨天', itemStyle: { color: '#2563eb' } }
                ]
            }]
        });
        echarts.init(document.getElementById('humidityChart')).setOption({
            tooltip: { trigger: 'axis' },
            grid: grid,
            xAxis: axis,
            yAxis: { type: 'value', max: 100 },
            series: [{ type: 'line', data: humidityData, smooth: true, itemStyle: { color: '#0891b2' } }]
        });
    })();
</script>
</body>
</html>
