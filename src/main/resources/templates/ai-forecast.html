<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${currentCity} + ' - 7 天预报'">7 天预报</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0">
            <i class="bi bi-graph-up text-soft"></i>
            <span th:text="${currentCity}">北京</span>
            <span class="text-muted small fw-light">· 7 天预报与 AI 预测</span>
        </h3>
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>

    <form th:action="@{/weather/ai-forecast/search}" method="get" class="search-bar mb-3">
        <input class="form-control" type="text" name="city" placeholder="切换城市" th:value="${currentCity}" required>
        <button class="btn btn-primary" type="submit">查询</button>
    </form>

    <div th:if="${forecastError}" class="alert-row alert-row--red mb-3">
        <i class="bi bi-exclamation-circle"></i>
        <div class="alert-row__body" th:text="${forecastError}">错误</div>
    </div>

    <div class="data-card" th:if="${forecast != null and !forecast.isEmpty()}">
        <div class="data-card-header">
            <h4><i class="bi bi-table icon"></i>官方 7 天预报</h4>
            <span class="text-muted small">数据来源：和风天气 QWeather /v7/weather/7d</span>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>天气</th>
                    <th class="text-right">最高</th>
                    <th class="text-right">最低</th>
                    <th class="text-right">湿度</th>
                    <th class="text-right">降水</th>
                    <th class="text-right">风速</th>
                    <th>风向</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${forecast}">
                    <td th:text="${#temporals.format(f.weatherDate, 'M/d EEE')}">1/1 周三</td>
                    <td th:text="${f.weatherText}">晴</td>
                    <td class="text-right text-warm" th:text="${f.tempMax != null ? #numbers.formatDecimal(f.tempMax, 1, 1) + '°C' : '--'}">28.0°C</td>
                    <td class="text-right text-cold" th:text="${f.tempMin != null ? #numbers.formatDecimal(f.tempMin, 1, 1) + '°C' : '--'}">15.0°C</td>
                    <td class="text-right" th:text="${f.humidity != null ? f.humidity + '%' : '--'}">60%</td>
                    <td class="text-right" th:text="${f.precip != null ? #numbers.formatDecimal(f.precip, 1, 1) + ' mm' : '0 mm'}">0 mm</td>
                    <td class="text-right" th:text="${f.windSpeed != null ? #numbers.formatDecimal(f.windSpeed, 1, 1) + ' km/h' : '--'}">10 km/h</td>
                    <td class="text-muted" th:text="${f.windDir} ?: '—'">南风</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="data-card mt-3" th:if="${predictions != null and !predictions.isEmpty()}">
        <div class="data-card-header">
            <h4><i class="bi bi-cpu icon"></i>AI 模型预测</h4>
            <span class="text-muted small">算法：线性回归 + 加权移动平均 · 基于近 30 天历史</span>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>目标日期</th>
                    <th>天气</th>
                    <th class="text-right">预测最高</th>
                    <th class="text-right">预测最低</th>
                    <th class="text-right">湿度</th>
                    <th class="text-right">降水</th>
                    <th class="text-right">置信度</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${predictions}">
                    <td th:text="${#temporals.format(p.targetDate, 'M/d EEE')}">1/2 周四</td>
                    <td th:text="${p.weatherPred}">多云</td>
                    <td class="text-right text-warm" th:text="${p.tempMaxPred != null ? #numbers.formatDecimal(p.tempMaxPred, 1, 1) + '°C' : '--'}">28.5°C</td>
                    <td class="text-right text-cold" th:text="${p.tempMinPred != null ? #numbers.formatDecimal(p.tempMinPred, 1, 1) + '°C' : '--'}">20.0°C</td>
                    <td class="text-right" th:text="${p.humidityPred != null ? p.humidityPred + '%' : '--'}">60%</td>
                    <td class="text-right" th:text="${p.precipPred != null ? #numbers.formatDecimal(p.precipPred, 1, 1) + ' mm' : '0 mm'}">0 mm</td>
                    <td class="text-right" th:text="${p.confidence != null ? #numbers.formatDecimal(p.confidence, 1, 2) : '--'}">0.80</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="data-card mt-3" th:if="${(forecast != null and !forecast.isEmpty()) or (predictions != null and !predictions.isEmpty())}">
        <div class="data-card-header">
            <h4><i class="bi bi-bar-chart-steps icon"></i>趋势对比</h4>
            <span class="text-muted small">最高温 / 最低温</span>
        </div>
        <div id="trendChart" class="chart-box"></div>
    </div>

    <div th:if="${(forecast == null or forecast.isEmpty()) and (predictions == null or predictions.isEmpty())}" class="empty-state">
        <i class="bi bi-cloud-slash"></i>
        <h4>暂无预报数据</h4>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    (function () {
        var forecast = /*[[${forecast}]]*/ [];
        var predictions = /*[[${predictions}]]*/ [];
        var chart = document.getElementById('trendChart');
        if (!chart || (!forecast || !forecast.length) && (!predictions || !predictions.length)) return;

        var dates = [], officialMax = [], officialMin = [], predMax = [], predMin = [];
        var i, d;

        if (forecast) {
            for (i = 0; i < forecast.length; i++) {
                d = forecast[i];
                var date = Array.isArray(d.weatherDate) ? d.weatherDate.join('-') : (d.weatherDate || '');
                dates.push(date);
                officialMax.push(d.tempMax != null ? parseFloat(d.tempMax) : null);
                officialMin.push(d.tempMin != null ? parseFloat(d.tempMin) : null);
            }
        }
        if (predictions) {
            for (i = 0; i < predictions.length; i++) {
                d = predictions[i];
                var date = Array.isArray(d.targetDate) ? d.targetDate.join('-') : (d.targetDate || '');
                if (dates.indexOf(date) === -1) dates.push(date);
                predMax.push(d.tempMaxPred != null ? parseFloat(d.tempMaxPred) : null);
                predMin.push(d.tempMinPred != null ? parseFloat(d.tempMinPred) : null);
            }
        }

        var series = [];
        if (officialMax.length) {
            series.push({ name: '官方最高', type: 'line', data: officialMax, smooth: true, itemStyle: { color: '#c0392b' }, lineStyle: { width: 2 } });
            series.push({ name: '官方最低', type: 'line', data: officialMin, smooth: true, itemStyle: { color: '#2563eb' }, lineStyle: { width: 2 } });
        }
        if (predMax.length) {
            series.push({ name: 'AI 预测最高', type: 'line', data: predMax, smooth: true, itemStyle: { color: '#d97706' }, lineStyle: { width: 2, type: 'dashed' } });
            series.push({ name: 'AI 预测最低', type: 'line', data: predMin, smooth: true, itemStyle: { color: '#0891b2' }, lineStyle: { width: 2, type: 'dashed' } });
        }

        echarts.init(chart).setOption({
            tooltip: { trigger: 'axis' },
            legend: { bottom: 0, textStyle: { fontSize: 12 } },
            grid: { left: 40, right: 20, top: 20, bottom: 50 },
            xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 11 } },
            yAxis: { type: 'value', axisLabel: { formatter: '{value}°C', fontSize: 11 } },
            series: series
        });
    })();
</script>
</body>
</html>
