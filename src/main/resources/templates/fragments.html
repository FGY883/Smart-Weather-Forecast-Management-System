<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- 导航栏 -->
<nav th:fragment="navbar" class="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-cloud-sun"></i> 智能天气预报
        </a>
        <button class="navbar-toggler" data-nav-toggle>
            <i class="bi bi-list"></i>
        </button>
        <div class="navbar-collapse" data-nav-target>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i>首页</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/weather/ai-forecast}"><i class="bi bi-calendar-week"></i>预报</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/weather/warning}"><i class="bi bi-exclamation-triangle"></i>预警</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/weather/statistics/search(city='北京')}"><i class="bi bi-bar-chart"></i>统计</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/weather/aether}"><i class="bi bi-grid-3x3-gap"></i>城市库</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="#" data-user-dropdown>
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">用户</span>
                        <i class="bi bi-chevron-down small"></i>
                    </a>
                    <ul class="dropdown-menu" data-user-menu>
                        <li><a class="dropdown-item" th:href="@{/user/profile}"><i class="bi bi-person"></i>个人中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="margin:0;">
                                <button type="submit" class="dropdown-item" style="width:100%;text-align:left;background:none;border:0;color:var(--danger);cursor:pointer;">
                                    <i class="bi bi-box-arrow-right"></i>退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i>登录</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/register}"><i class="bi bi-person-plus"></i>注册</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 页脚 -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        智能天气预报系统 &middot; 天气数据来源 <a href="https://www.qweather.com" target="_blank" rel="noopener">和风天气 QWeather</a>
    </div>
</footer>

</body>
</html>
