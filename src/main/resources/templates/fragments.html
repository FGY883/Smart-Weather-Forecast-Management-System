<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ==================== 导航栏片段 ==================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-cloud-sun me-2"></i>Aether Weather
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- 左侧导航链接 -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i>首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/weather/warning}">
                        <i class="bi bi-exclamation-triangle me-1"></i>天气预警
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/weather/ai-forecast}">
                        <i class="bi bi-graph-up me-1"></i>7天预报
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/weather/statistics/search(city='北京')}">
                        <i class="bi bi-bar-chart me-1"></i>数据统计
                    </a>
                </li>
            </ul>
            <!-- 右侧用户信息 -->
            <ul class="navbar-nav">
                <!-- 已登录：个人中心下拉菜单（依据模型 user 判断，项目未引入 sec 方言） -->
                <li class="nav-item dropdown" th:if="${user != null}">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${user.nickname != null and !user.nickname.isEmpty() ? user.nickname : user.username}">用户名</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm rounded-3" aria-labelledby="userDropdown">
                        <li>
                            <a class="dropdown-item" th:href="@{/user/profile}">
                                <i class="bi bi-person me-2"></i>个人中心
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" th:href="@{/user/profile#profile-info}">
                                <i class="bi bi-pencil-square me-2"></i>个人信息
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/user/profile#profile-favorites}">
                                <i class="bi bi-star me-2"></i>我的收藏
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/user/profile#profile-push}">
                                <i class="bi bi-bell me-2"></i>推送记录
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>退出登录
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
                <!-- 未登录：仅在 user 为空时显示登录/注册 -->
                <li class="nav-item" th:if="${user == null}">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>登录
                    </a>
                </li>
                <li class="nav-item" th:if="${user == null}">
                    <a class="nav-link" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i>注册
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <!-- 供前端判断登录态：data-auth 由服务端按 user 注入 -->
    <div id="authState" class="d-none" th:attr="data-auth=${user != null},data-login=@{/login}"></div>
</nav>

<!-- ==================== 预警徽章片段（英文码 → 中文，等级配色） ==================== -->
<th:block th:fragment="warningLevelBadge(level)">
    <span class="badge ms-2"
          th:classappend="${level == 'RED' ? 'bg-danger' : (level == 'ORANGE' ? 'bg-warning text-dark' : (level == 'YELLOW' ? 'bg-info text-dark' : 'bg-primary'))}"
          th:text="${level == 'RED' ? '红色' : (level == 'ORANGE' ? '橙色' : (level == 'YELLOW' ? '黄色' : (level == 'BLUE' ? '蓝色' : level)))}">红色</span>
</th:block>

<th:block th:fragment="warningTypeBadge(type)">
    <span class="badge bg-secondary ms-1"
          th:text="${type == 'HIGH_TEMP' ? '高温' : (type == 'COLD_WAVE' ? '寒潮' : (type == 'HEAVY_RAIN' ? '暴雨' : (type == 'STRONG_WIND' ? '大风' : type)))}">类型</span>
</th:block>

<!-- ==================== 全局 AI 助手悬浮组件（仅登录用户渲染） ==================== -->
<th:block th:fragment="assistant" th:if="${user != null}">
    <style>
        /* 复用全站设计令牌，与 Aether 风格保持一致（配色/圆角/阴影/字体/缓动） */
        #aiA-root{position:fixed;z-index:10000;width:60px;height:60px;top:0;left:0;font-family:var(--font-body);}
        #aiA-ball{width:60px;height:60px;border:none;border-radius:50%;cursor:grab;
            background:radial-gradient(circle at 30% 30%,var(--primary-color),var(--primary-dark));
            color:#fff;box-shadow:var(--shadow-hover);display:flex;align-items:center;justify-content:center;
            font-size:26px;transition:transform .25s var(--ease-aether);touch-action:none;user-select:none;position:relative;}
        #aiA-ball:hover{transform:scale(1.06);}
        #aiA-ball:active{cursor:grabbing;}
        #aiA-ball .aiA-badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;
            background:var(--danger-color);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;border:2px solid #fff;}
        #aiA-root.aiA-unread .aiA-badge{display:flex;}
        #aiA-panel{position:absolute;width:min(360px,calc(100vw - 24px));height:min(480px,calc(100vh - 96px));
            background:#fff;border-radius:var(--r-card-soft);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;
            opacity:0;transform:translateY(12px) scale(.96);transform-origin:bottom right;pointer-events:none;
            transition:opacity .28s var(--ease-aether),transform .28s var(--ease-aether);right:0;bottom:70px;}
        #aiA-root.aiA-open #aiA-panel{opacity:1;transform:none;pointer-events:auto;}
        #aiA-root.aiA-side-right #aiA-panel{left:0;right:auto;transform-origin:bottom left;}
        #aiA-root.aiA-side-down #aiA-panel{top:70px;bottom:auto;transform-origin:top right;}
        #aiA-root.aiA-side-right.aiA-side-down #aiA-panel{transform-origin:top left;}
        .aiA-head{padding:14px 16px;background:linear-gradient(135deg,var(--primary-color),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:space-between;}
        .aiA-head h6{margin:0;font-family:var(--font-cn);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;}
        .aiA-head small{opacity:.85;font-weight:400;}
        .aiA-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;transition:background .2s;}
        .aiA-close:hover{background:rgba(255,255,255,.35);}
        .aiA-body{flex:1;overflow-y:auto;padding:14px;background:var(--sky-mid);}
        .aiA-msg{display:flex;margin-bottom:12px;}
        .aiA-msg.aiA-user{justify-content:flex-end;}
        .aiA-bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:.92rem;line-height:1.5;box-shadow:var(--shadow-rest);word-break:break-word;}
        .aiA-ai .aiA-bubble{background:#fff;color:var(--ink);border-bottom-left-radius:4px;}
        .aiA-user .aiA-bubble{background:var(--primary-color);color:#fff;border-bottom-right-radius:4px;}
        .aiA-suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
        .aiA-chip{background:#fff;border:1px solid rgba(74,144,217,.35);color:var(--primary-dark);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;transition:all .2s var(--ease-aether);}
        .aiA-chip:hover{background:var(--primary-color);color:#fff;}
        .aiA-typing .aiA-bubble{display:inline-flex;gap:4px;}
        .aiA-typing .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);animation:aiA-blink 1.2s infinite;}
        .aiA-typing .dot:nth-child(2){animation-delay:.2s;}
        .aiA-typing .dot:nth-child(3){animation-delay:.4s;}
        @keyframes aiA-blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
        .aiA-input{display:flex;gap:8px;padding:12px;border-top:1px solid #eef2f8;background:#fff;}
        .aiA-input textarea{flex:1;resize:none;border:1px solid #dbe4f0;border-radius:12px;padding:8px 12px;font-size:.9rem;font-family:var(--font-body);max-height:80px;}
        .aiA-input textarea:focus{outline:none;border-color:var(--primary-color);}
        .aiA-send{border:none;background:var(--primary-color);color:#fff;border-radius:12px;padding:0 16px;cursor:pointer;font-weight:600;transition:background .2s;}
        .aiA-send:hover{background:var(--primary-dark);}
        .aiA-send:disabled{opacity:.6;cursor:not-allowed;}
    </style>

    <div id="aiA-root" role="complementary" aria-label="AI 助手">
        <div id="aiA-panel" aria-hidden="true">
            <div class="aiA-head">
                <h6><i class="bi bi-stars"></i><span id="aiA-name">小天</span> <small>· 系统使用助手</small></h6>
                <button class="aiA-close" id="aiA-close" type="button" aria-label="收起">×</button>
            </div>
            <div class="aiA-body" id="aiA-body"></div>
            <div class="aiA-input">
                <textarea id="aiA-text" rows="1" placeholder="问我关于本系统的使用问题…"></textarea>
                <button class="aiA-send" id="aiA-send" type="button">发送</button>
            </div>
        </div>
        <button id="aiA-ball" type="button" aria-label="打开 AI 助手"><i class="bi bi-patch-question-fill"></i><span class="aiA-badge">1</span></button>
    </div>

    <script>
    (function () {
        var root = document.getElementById('aiA-root');
        var ball = document.getElementById('aiA-ball');
        var body = document.getElementById('aiA-body');
        var text = document.getElementById('aiA-text');
        var sendBtn = document.getElementById('aiA-send');
        var closeBtn = document.getElementById('aiA-close');
        var nameEl = document.getElementById('aiA-name');
        if (!root || !ball) return;

        var KEY_POS = 'aiA.pos', KEY_OPEN = 'aiA.open';
        var SIZE = 60, MARGIN = 8;
        var state = { open: false, greeted: false };
        var convo = []; // 已完成对话轮次 [{role,content}]，随请求携带以提供上下文

        function clamp(x, y) {
            var maxX = window.innerWidth - SIZE - MARGIN;
            var maxY = window.innerHeight - SIZE - MARGIN;
            return { x: Math.max(MARGIN, Math.min(x, maxX)), y: Math.max(MARGIN, Math.min(y, maxY)) };
        }
        function applyPos(x, y) { var p = clamp(x, y); root.style.left = p.x + 'px'; root.style.top = p.y + 'px'; }
        function currentPos() { var r = root.getBoundingClientRect(); return { x: r.left, y: r.top }; }

        // 恢复位置（跨页面保持）
        var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY_POS)); } catch (e) {}
        if (saved && typeof saved.x === 'number') applyPos(saved.x, saved.y);
        else { var d = clamp(window.innerWidth - SIZE - 20, window.innerHeight - SIZE - 20); applyPos(d.x, d.y); }

        // 面板朝向：球靠左半则面板向右开，靠上半则向下开，避免溢出视口
        function placePanel() {
            var r = root.getBoundingClientRect();
            root.classList.toggle('aiA-side-right', r.left < window.innerWidth / 2);
            root.classList.toggle('aiA-side-down', r.top < window.innerHeight / 2);
        }
        function setOpen(open) {
            state.open = open;
            if (open) {
                placePanel(); root.classList.add('aiA-open'); root.classList.remove('aiA-unread');
                document.getElementById('aiA-panel').setAttribute('aria-hidden', 'false');
                if (!state.greeted) greet();
            } else {
                root.classList.remove('aiA-open');
                document.getElementById('aiA-panel').setAttribute('aria-hidden', 'true');
            }
            try { localStorage.setItem(KEY_OPEN, open ? '1' : '0'); } catch (e) {}
        }
        if (localStorage.getItem(KEY_OPEN) === '1') setOpen(true);

        // 拖动 vs 点击：位移>4px 记为拖动，否则视为点击展开/收起
        var drag = { active: false, moved: false, sx: 0, sy: 0, ox: 0, oy: 0 };
        ball.addEventListener('pointerdown', function (e) {
            drag.active = true; drag.moved = false; drag.sx = e.clientX; drag.sy = e.clientY;
            var r = root.getBoundingClientRect(); drag.ox = e.clientX - r.left; drag.oy = e.clientY - r.top;
            try { ball.setPointerCapture(e.pointerId); } catch (x) {}
        });
        ball.addEventListener('pointermove', function (e) {
            if (!drag.active) return;
            if (Math.abs(e.clientX - drag.sx) > 4 || Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
            if (drag.moved) { applyPos(e.clientX - drag.ox, e.clientY - drag.oy); if (state.open) placePanel(); }
        });
        ball.addEventListener('pointerup', function (e) {
            if (!drag.active) return; drag.active = false;
            try { ball.releasePointerCapture(e.pointerId); } catch (x) {}
            if (drag.moved) { var p = currentPos(); try { localStorage.setItem(KEY_POS, JSON.stringify(p)); } catch (x) {} }
            else { setOpen(!state.open); }
        });
        ball.addEventListener('pointercancel', function () { drag.active = false; });
        closeBtn.addEventListener('click', function () { setOpen(false); });
        window.addEventListener('resize', function () { var p = currentPos(); applyPos(p.x, p.y); if (state.open) placePanel(); });

        function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s == null ? '' : String(s))); return d.innerHTML; }
        function addMsg(role, html) {
            var row = document.createElement('div');
            row.className = 'aiA-msg ' + (role === 'user' ? 'aiA-user' : 'aiA-ai');
            row.innerHTML = '<div class="aiA-bubble">' + html + '</div>';
            body.appendChild(row); body.scrollTop = body.scrollHeight; return row;
        }
        function renderSuggestions(list) {
            if (!list || !list.length) return;
            var wrap = document.createElement('div'); wrap.className = 'aiA-suggest';
            list.forEach(function (s) {
                var c = document.createElement('span'); c.className = 'aiA-chip'; c.textContent = s;
                c.addEventListener('click', function () { ask(s); });
                wrap.appendChild(c);
            });
            var row = document.createElement('div'); row.className = 'aiA-msg aiA-ai'; row.appendChild(wrap);
            body.appendChild(row); body.scrollTop = body.scrollHeight;
        }
        function greet() {
            state.greeted = true;
            fetch('/api/assistant/meta').then(function (r) { return r.json(); }).then(function (res) {
                var d = (res && res.data) || {};
                if (d.name) nameEl.textContent = d.name;
                addMsg('ai', esc(d.greeting || '你好，我可以帮你解答本系统的使用问题。'));
                renderSuggestions(d.suggestions);
            }).catch(function () { addMsg('ai', '你好，我可以帮你解答本系统的使用问题。'); });
        }
        function ask(msg) {
            var q = (msg || '').trim(); if (!q) return;
            text.value = ''; addMsg('user', esc(q));
            var typing = addMsg('ai', '<span class="dot"></span><span class="dot"></span><span class="dot"></span>');
            typing.classList.add('aiA-typing'); sendBtn.disabled = true;
            var url = '/api/assistant/chat?message=' + encodeURIComponent(q);
            if (convo.length) url += '&history=' + encodeURIComponent(JSON.stringify(convo.slice(-10)));
            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    typing.remove();
                    var d = (res && res.data) || {};
                    var reply = d.reply || (res && res.msg) || '暂时无法回答，请稍后再试。';
                    addMsg('ai', esc(reply));
                    convo.push({ role: 'user', content: q });
                    convo.push({ role: 'assistant', content: reply });
                    if (!state.open) root.classList.add('aiA-unread');
                })
                .catch(function () { typing.remove(); addMsg('ai', '网络异常，请稍后再试。'); })
                .then(function () { sendBtn.disabled = false; text.focus(); });
        }
        sendBtn.addEventListener('click', function () { ask(text.value); });
        text.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(text.value); } });
    })();
    </script>
</th:block>

<!-- ==================== 页脚片段（包裹：页脚 + 全局助手，引用页即带助手） ==================== -->
<th:block th:fragment="footer">
<footer class="bg-light text-muted py-4 mt-5 border-top">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <p class="mb-1">
                    <i class="bi bi-cloud-sun me-1"></i>
                    <strong>智能天气预报系统</strong>
                </p>
                <p class="mb-0 small">基于 Spring Boot + Thymeleaf + AI 构建的智能天气预报平台</p>
                <p class="mb-0 small mt-1">
                    <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill">
                        <i class="bi bi-cloud me-1"></i>天气数据来源：和风天气 (QWeather)
                    </span>
                </p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="mb-1">&copy; 2026 智能天气预报系统 版权所有</p>
                <p class="mb-0 small">天气数据来源：和风天气 (QWeather) | 预报接口：/v7/weather/7d</p>
            </div>
        </div>
    </div>
</footer>
<th:block th:replace="fragments :: assistant"></th:block>
</th:block>

</body>
</html>
