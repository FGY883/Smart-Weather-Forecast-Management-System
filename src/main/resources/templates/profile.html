<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 智能天气预报系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Aether 背景云朵漂移装饰 -->
    <div class="skydeco" aria-hidden="true">
        <div class="drift">☁</div>
        <div class="drift">☁</div>
        <div class="drift">☁</div>
    </div>

    <!-- 导航栏 -->
    <div th:replace="fragments :: navbar"></div>

    <div class="container mt-4">
        <!-- 页面标题 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">
                <i class="bi bi-person-circle text-primary me-2"></i>个人中心
            </h3>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>返回首页
            </a>
        </div>

        <!-- 成功/错误消息 -->
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <!-- 左侧：账号概览（粘性） -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 sticky-lg-top" style="top: 1rem;">
                    <div class="card-body text-center p-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3"
                             style="width: 96px; height: 96px; font-size: 2.4rem;">
                            <span th:text="${user.nickname != null and !user.nickname.isEmpty() ? user.nickname.substring(0, 1) : (user.username.substring(0,1))}">U</span>
                        </div>
                        <h5 class="mb-1" th:text="${user.nickname != null and !user.nickname.isEmpty() ? user.nickname : user.username}">用户昵称</h5>
                        <p class="text-muted mb-3 small">
                            <i class="bi bi-at me-1"></i><span th:text="${user.username}">username</span>
                        </p>

                        <div class="text-start small">
                            <div class="d-flex align-items-center mb-2" th:if="${user.email != null and !user.email.isEmpty()}">
                                <i class="bi bi-envelope text-muted me-2"></i><span th:text="${user.email}" class="text-truncate">email</span>
                            </div>
                            <div class="d-flex align-items-center mb-2" th:if="${user.phone != null and !user.phone.isEmpty()}">
                                <i class="bi bi-telephone text-muted me-2"></i><span th:text="${user.phone}">phone</span>
                            </div>
                            <div class="d-flex align-items-center mb-2" th:if="${user.city != null and !user.city.isEmpty()}">
                                <i class="bi bi-geo-alt text-muted me-2"></i>默认城市：<span th:text="${user.city}">北京</span>
                            </div>
                        </div>

                        <span class="badge rounded-pill mt-2"
                              th:classappend="${user.pushEnabled != null and user.pushEnabled ? 'bg-success' : 'bg-secondary'}"
                              th:text="${user.pushEnabled != null and user.pushEnabled ? '推送已开启' : '推送已关闭'}">推送状态</span>
                    </div>

                    <!-- 快捷跳转 -->
                    <div class="card-footer bg-white border-0 pb-3">
                        <div class="list-group list-group-flush rounded-3">
                            <a href="#profile-info" class="list-group-item list-group-item-action"><i class="bi bi-pencil-square me-2 text-primary"></i>个人信息</a>
                            <a href="#profile-favorites" class="list-group-item list-group-item-action"><i class="bi bi-star me-2 text-warning"></i>我的收藏</a>
                            <a href="#profile-push" class="list-group-item list-group-item-action"><i class="bi bi-bell me-2 text-info"></i>推送记录</a>
                            <a href="#profile-password" class="list-group-item list-group-item-action"><i class="bi bi-shield-lock me-2 text-success"></i>修改密码</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：分区内容 -->
            <div class="col-lg-8">

                <!-- 个人信息编辑 -->
                <div id="profile-info" class="card border-0 shadow-lg rounded-4 mb-4 section-card">
                    <div class="card-header bg-transparent border-0 pb-0 pt-4">
                        <h5 class="mb-0 section-title"><i class="bi bi-pencil-square text-primary me-2"></i>个人信息</h5>
                        <p class="text-muted small mb-0 mt-1">维护你的昵称、联系方式与默认城市。</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/profile}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nickname" class="form-label">昵称</label>
                                    <input type="text" class="form-control" id="nickname" name="nickname"
                                           th:value="${user.nickname}" placeholder="请输入昵称">
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           th:value="${user.email}" placeholder="请输入邮箱">
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">手机号</label>
                                    <input type="tel" class="form-control" id="phone" name="phone"
                                           th:value="${user.phone}" placeholder="请输入手机号">
                                </div>
                                <div class="col-md-6">
                                    <label for="city" class="form-label">默认城市</label>
                                    <input type="text" class="form-control" id="city" name="city"
                                           th:value="${user.city}" placeholder="请输入默认城市">
                                </div>
                                <div class="col-md-6">
                                    <label for="cityCode" class="form-label">城市编码</label>
                                    <input type="text" class="form-control" id="cityCode" name="cityCode"
                                           th:value="${user.cityCode}" placeholder="如：101010100">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="pushEnabled"
                                               name="pushEnabled" value="true"
                                               th:checked="${user.pushEnabled != null and user.pushEnabled}">
                                        <label class="form-check-label" for="pushEnabled">
                                            <i class="bi bi-bell me-1"></i>开启天气推送通知
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary rounded-pill px-4">
                                    <i class="bi bi-check-lg me-1"></i>保存修改
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 修改密码 -->
                <div id="profile-password" class="card border-0 shadow-lg rounded-4 mb-4 section-card">
                    <div class="card-header bg-transparent border-0 pb-0 pt-4">
                        <h5 class="mb-0 section-title"><i class="bi bi-shield-lock text-success me-2"></i>修改密码</h5>
                        <p class="text-muted small mb-0 mt-1">建议定期更换，密码至少 6 位。</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/password}" method="post">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="oldPassword" class="form-label">原密码</label>
                                    <input type="password" class="form-control" id="oldPassword"
                                           name="oldPassword" placeholder="请输入原密码" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="newPassword" class="form-label">新密码</label>
                                    <input type="password" class="form-control" id="newPassword"
                                           name="newPassword" placeholder="请输入新密码（至少6位）" required minlength="6">
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label">确认新密码</label>
                                    <input type="password" class="form-control" id="confirmPassword"
                                           name="confirmPassword" placeholder="请再次输入新密码" required minlength="6">
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-success rounded-pill px-4">
                                    <i class="bi bi-key me-1"></i>修改密码
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 我的收藏 -->
                <div id="profile-favorites" class="card border-0 shadow-lg rounded-4 mb-4 section-card">
                    <div class="card-header bg-transparent border-0 pb-0 pt-4 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 section-title"><i class="bi bi-star text-warning me-2"></i>我的收藏</h5>
                            <p class="text-muted small mb-0 mt-1">收藏常看的城市，便于快速查询。</p>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="loadFavorites()">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                    </div>
                    <div class="card-body p-4">
                        <div id="favoritesList">
                            <div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>加载中…</div>
                        </div>
                    </div>
                </div>

                <!-- 推送记录 -->
                <div id="profile-push" class="card border-0 shadow-lg rounded-4 mb-4 section-card">
                    <div class="card-header bg-transparent border-0 pb-0 pt-4 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 section-title"><i class="bi bi-bell text-info me-2"></i>推送记录</h5>
                            <p class="text-muted small mb-0 mt-1">系统每日天气与极端天气预警的推送历史。</p>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="loadPushRecords()">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                    </div>
                    <div class="card-body p-4">
                        <div id="pushRecordsList">
                            <div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>加载中…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div th:replace="fragments :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
