<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0"><i class="bi bi-person-circle text-soft"></i> 个人中心</h3>
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>

    <div th:if="${successMsg}" class="alert-row alert-row--blue mb-3">
        <i class="bi bi-check-circle"></i>
        <div class="alert-row__body" th:text="${successMsg}">成功</div>
    </div>
    <div th:if="${errorMsg}" class="alert-row alert-row--red mb-3">
        <i class="bi bi-exclamation-circle"></i>
        <div class="alert-row__body" th:text="${errorMsg}">错误</div>
    </div>

    <div class="profile-grid">
        <div>
            <div class="data-card">
                <div class="profile-info">
                    <div class="profile-avatar" th:text="${user.nickname != null and !user.nickname.isEmpty() ? user.nickname.substring(0, 1) : 'U'}">U</div>
                    <h3 th:text="${user.nickname != null and !user.nickname.isEmpty() ? user.nickname : user.username}">昵称</h3>
                    <div class="text-muted small" th:text="${user.username}">username</div>
                    <hr style="margin: 12px 0; border: 0; border-top: 1px solid var(--line);">
                    <div class="text-soft small text-left" th:if="${user.email != null and !user.email.isEmpty()}">
                        <i class="bi bi-envelope"></i> <span th:text="${user.email}">email</span>
                    </div>
                    <div class="text-soft small" th:if="${user.phone != null and !user.phone.isEmpty()}" style="margin-top:4px;">
                        <i class="bi bi-phone"></i> <span th:text="${user.phone}">phone</span>
                    </div>
                    <div class="text-soft small" th:if="${user.city != null and !user.city.isEmpty()}" style="margin-top:4px;">
                        <i class="bi bi-geo-alt"></i> <span th:text="${user.city}">city</span>
                    </div>
                    <div class="mt-3">
                        <span th:class="${user.pushEnabled != null and user.pushEnabled ? 'badge badge--active' : 'badge badge--closed'}"
                              th:text="${user.pushEnabled != null and user.pushEnabled ? '推送已开启' : '推送已关闭'}">推送</span>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="data-card">
                <div class="data-card-header"><h4><i class="bi bi-pencil-square icon"></i>个人信息</h4></div>
                <form th:action="@{/user/profile}" method="post">
                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">昵称</label>
                            <input class="form-control" type="text" name="nickname" th:value="${user.nickname}">
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input class="form-control" type="email" name="email" th:value="${user.email}">
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">手机号</label>
                            <input class="form-control" type="tel" name="phone" th:value="${user.phone}">
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">默认城市</label>
                            <input class="form-control" type="text" name="city" th:value="${user.city}">
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">城市编码</label>
                            <input class="form-control" type="text" name="cityCode" th:value="${user.cityCode}" placeholder="如 101010100">
                        </div>
                        <div class="col-12 col-md-6 mb-3 d-flex align-items-end">
                            <label class="form-check">
                                <input class="form-check-input" type="checkbox" name="pushEnabled" value="true" th:checked="${user.pushEnabled != null and user.pushEnabled}">
                                <span>开启每日天气推送</span>
                            </label>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> 保存</button>
                </form>
            </div>

            <div class="data-card">
                <div class="data-card-header"><h4><i class="bi bi-shield-lock icon"></i>修改密码</h4></div>
                <form th:action="@{/user/password}" method="post">
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="form-label">原密码</label>
                            <input class="form-control" type="password" name="oldPassword" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">新密码（≥ 6 位）</label>
                            <input class="form-control" type="password" name="newPassword" minlength="6" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label">确认新密码</label>
                            <input class="form-control" type="password" name="confirmPassword" minlength="6" required>
                        </div>
                    </div>
                    <button class="btn btn-warning" type="submit"><i class="bi bi-key"></i> 修改密码</button>
                </form>
            </div>

            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-star icon"></i>我的收藏</h4>
                    <button class="btn btn-sm btn-outline-secondary" data-reload-fav>刷新</button>
                </div>
                <div id="favoritesList"></div>
            </div>

            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-bell icon"></i>推送记录</h4>
                    <button class="btn btn-sm btn-outline-secondary" data-reload-push>刷新</button>
                </div>
                <div id="pushList"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
<script th:src="@{/js/main.js}"></script>
<script>
    (function () {
        var favBox = document.getElementById('favoritesList');
        var pushBox = document.getElementById('pushList');

        WeatherApp.loadFavoritesInto(favBox);
        WeatherApp.loadPushInto(pushBox);

        var reloadFav = document.querySelector('[data-reload-fav]');
        if (reloadFav) reloadFav.addEventListener('click', function () { WeatherApp.loadFavoritesInto(favBox); });
        var reloadPush = document.querySelector('[data-reload-push]');
        if (reloadPush) reloadPush.addEventListener('click', function () { WeatherApp.loadPushInto(pushBox); });
    })();
</script>
</body>
</html>
