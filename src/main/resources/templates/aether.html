<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市天气一览 - 智能天气预报</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="data-card">
        <div class="data-card-header">
            <h4><i class="bi bi-grid-3x3-gap icon"></i>城市天气一览</h4>
            <a class="small" th:href="@{/}"><i class="bi bi-arrow-left"></i> 返回首页</a>
        </div>
        <div class="search-bar">
            <input class="form-control" type="text" id="aetherSearch" placeholder="按城市名过滤">
            <button class="btn btn-primary" type="button" id="aetherRefresh">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
        </div>
        <div class="aether-grid" id="cityGrid"></div>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    (function () {
        var rawJson = /*[[${cityCardsJson}]]*/ '[]';
        WeatherApp.renderCityGrid(document.getElementById('cityGrid'), rawJson);

        var input = document.getElementById('aetherSearch');
        var refresh = document.getElementById('aetherRefresh');
        if (input) {
            input.addEventListener('input', function () {
                var q = input.value.trim().toLowerCase();
                var cards = document.querySelectorAll('.aether-card');
                for (var i = 0; i < cards.length; i++) {
                    var name = (cards[i].dataset.city || '').toLowerCase();
                    cards[i].style.display = !q || name.indexOf(q) !== -1 ? '' : 'none';
                }
            });
        }
        if (refresh) {
            refresh.addEventListener('click', function () { location.reload(); });
        }
    })();
</script>
</body>
</html>
