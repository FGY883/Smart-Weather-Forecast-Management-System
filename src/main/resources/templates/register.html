<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container">
    <div class="auth-card">
        <h2>注册</h2>
        <div class="subtitle">创建账号以使用个性化功能</div>

        <div th:if="${errorMsg}" class="alert-row alert-row--red mb-3">
            <i class="bi bi-exclamation-circle"></i>
            <div class="alert-row__body" th:text="${errorMsg}">错误</div>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">用户名 <span class="text-warm">*</span></label>
                <input class="form-control form-control-lg" type="text" id="username" name="username" required autofocus placeholder="3-30 位，中英文 / 数字 / 下划线">
            </div>
            <div class="form-group">
                <label for="password">密码 <span class="text-warm">*</span></label>
                <input class="form-control form-control-lg" type="password" id="password" name="password" minlength="6" required placeholder="至少 6 位">
            </div>
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input class="form-control form-control-lg" type="text" id="nickname" name="nickname" placeholder="选填">
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input class="form-control form-control-lg" type="email" id="email" name="email" placeholder="选填">
            </div>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input class="form-control form-control-lg" type="tel" id="phone" name="phone" placeholder="选填">
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit">
                <i class="bi bi-person-plus"></i> 注 册
            </button>
        </form>

        <div class="text-center mt-3 small text-soft">
            已有账号？ <a th:href="@{/login}">立即登录</a>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
