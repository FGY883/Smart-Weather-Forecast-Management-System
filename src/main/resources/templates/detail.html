<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${currentCity} + ' - 天气详情'">天气详情</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0">
            <i class="bi bi-geo-alt-fill text-soft"></i>
            <span th:text="${currentCity}">北京</span>
            <span class="text-muted small fw-light">· 天气详情</span>
        </h3>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
            <button th:if="${user != null}"
                    th:attr="data-favorite-btn='1',data-city=${currentCity},data-city-code=${currentCityCode},data-logged-in='1',data-favorited=${isFavorited != null and isFavorited ? '1' : '0'}"
                    th:class="${isFavorited != null and isFavorited ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'}">
                <i th:class="${isFavorited != null and isFavorited ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                <span th:text="${isFavorited != null and isFavorited ? '已收藏' : '收藏'}">收藏</span>
            </button>
        </div>
    </div>

    <div th:if="${warnings != null and !warnings.isEmpty()}" class="alert-list">
        <div th:each="w : ${warnings}"
             th:class="'alert-row alert-row--' + ${w.warningLevel == null ? 'yellow' : #strings.toLowerCase(w.warningLevel)}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div class="alert-row__body">
                <div class="alert-row__title" th:text="${w.warningTitle}">预警</div>
                <div class="alert-row__content" th:text="${w.warningContent}">内容</div>
            </div>
            <div class="alert-row__time" th:text="${#temporals.format(w.startTime, 'MM-dd HH:mm')}">时间</div>
        </div>
    </div>

    <div th:if="${weatherError}" class="alert-row alert-row--red mb-3">
        <i class="bi bi-exclamation-circle"></i>
        <div class="alert-row__body" th:text="${weatherError}">错误</div>
    </div>

    <div th:if="${realtime != null}" class="row">
        <div class="col-12 col-lg-7">
            <div class="weather-now">
                <div class="weather-now__head">
                    <div>
                        <div class="weather-now__city">
                            <i class="bi bi-geo-alt-fill"></i>
                            <span th:text="${currentCity}">北京</span>
                        </div>
                        <div class="weather-now__date" th:text="${#temporals.format(realtime.weatherDate, 'yyyy 年 M 月 d 日')} + ' · ' + ${realtime.weatherText}">日期</div>
                    </div>
                    <div>
                        <div class="weather-now__temp">
                            <span th:text="${realtime.temp != null ? #numbers.formatDecimal(realtime.temp, 1, 0) : '--'}">25</span><sup>°C</sup>
                        </div>
                        <div class="weather-now__feels">体感 <span th:text="${realtime.feelsLike != null ? #numbers.formatDecimal(realtime.feelsLike, 1, 0) + '°' : '--'}">25°</span></div>
                    </div>
                </div>
                <div class="weather-now__metrics">
                    <div class="metric"><div class="metric__label">湿度</div><div class="metric__value" th:text="${realtime.humidity != null ? realtime.humidity + '%' : '--'}">60%</div></div>
                    <div class="metric"><div class="metric__label">风向</div><div class="metric__value" th:text="${realtime.windDir} ?: '—'">南风</div></div>
                    <div class="metric"><div class="metric__label">风速</div><div class="metric__value" th:text="${realtime.windSpeed != null ? #numbers.formatDecimal(realtime.windSpeed, 1, 1) + ' km/h' : '--'}">10</div></div>
                    <div class="metric"><div class="metric__label">气压</div><div class="metric__value" th:text="${realtime.pressure != null ? realtime.pressure + ' hPa' : '--'}">1013</div></div>
                    <div class="metric"><div class="metric__label">能见度</div><div class="metric__value" th:text="${realtime.visibility != null ? #numbers.formatDecimal(realtime.visibility, 1, 1) + ' km' : '--'}">15</div></div>
                    <div class="metric"><div class="metric__label">降水量</div><div class="metric__value" th:text="${realtime.precip != null ? #numbers.formatDecimal(realtime.precip, 1, 1) + ' mm' : '0 mm'}">0</div></div>
                    <div class="metric"><div class="metric__label">最高温</div><div class="metric__value metric__value--warm" th:text="${realtime.tempMax != null ? #numbers.formatDecimal(realtime.tempMax, 1, 0) + '°' : '--'}">30°</div></div>
                    <div class="metric"><div class="metric__label">最低温</div><div class="metric__value metric__value--cold" th:text="${realtime.tempMin != null ? #numbers.formatDecimal(realtime.tempMin, 1, 0) + '°' : '--'}">18°</div></div>
                    <div class="metric"><div class="metric__label">紫外线</div><div class="metric__value" th:text="${realtime.uvIndex != null ? realtime.uvIndex : '--'}">5</div></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-5">
            <div class="data-card">
                <div class="data-card-header">
                    <h4><i class="bi bi-calendar-week icon"></i>7 天预报</h4>
                </div>
                <table class="data-table" th:if="${forecast != null and !forecast.isEmpty()}">
                    <thead><tr><th>日期</th><th>天气</th><th class="text-right">最高</th><th class="text-right">最低</th><th>风</th></tr></thead>
                    <tbody>
                        <tr th:each="d, iter : ${forecast}">
                            <td>
                                <strong th:if="${iter.index == 0}">今天</strong>
                                <span th:if="${iter.index != 0}" th:text="${#temporals.format(d.weatherDate, 'M/d')}">1/2</span>
                            </td>
                            <td th:text="${d.weatherText}">晴</td>
                            <td class="text-right text-warm" th:text="${d.tempMax != null ? #numbers.formatDecimal(d.tempMax, 1, 0) + '°' : '--'}">30°</td>
                            <td class="text-right text-cold" th:text="${d.tempMin != null ? #numbers.formatDecimal(d.tempMin, 1, 0) + '°' : '--'}">18°</td>
                            <td class="text-muted" th:text="${d.windDir} ?: '—'">南风</td>
                        </tr>
                    </tbody>
                </table>
                <div th:unless="${forecast != null and !forecast.isEmpty()}" class="empty-state">暂无预报</div>
            </div>
        </div>
    </div>

    <div th:if="${cityCardsJson != null}" class="data-card mt-3">
        <div class="data-card-header">
            <h4><i class="bi bi-grid-3x3-gap icon"></i>城市天气一览</h4>
            <a class="small" th:href="@{/weather/aether}">展开完整城市库 →</a>
        </div>
        <div class="aether-grid" id="cityGrid"></div>
    </div>

    <div th:if="${realtime == null and weatherError == null}" class="empty-state">
        <i class="bi bi-cloud-sun"></i>
        <h4>暂无天气数据</h4>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    WeatherApp.renderCityGrid(document.getElementById('cityGrid'), /*[[${cityCardsJson}]]*/ '[]');
</script>
</body>
</html>
