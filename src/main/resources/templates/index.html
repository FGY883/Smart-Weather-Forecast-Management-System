<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 智能天气预报</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <!-- 搜索栏 -->
    <form th:action="@{/weather/search}" method="get" class="search-bar">
        <input class="form-control" type="text" name="city" placeholder="搜索城市，如 北京 / 上海 / 厦门" required>
        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> 搜索</button>
    </form>

    <!-- 错误提示 -->
    <div th:if="${searchError}" class="alert alert-row alert-row--yellow mb-3">
        <i class="bi bi-exclamation-triangle"></i>
        <div class="alert-row__body" th:text="${searchError}">未找到城市</div>
    </div>
    <div th:if="${weatherError}" class="alert alert-row alert-row--red mb-3">
        <i class="bi bi-exclamation-circle"></i>
        <div class="alert-row__body" th:text="${weatherError}">获取失败</div>
    </div>

    <!-- 预警横幅 -->
    <div th:if="${warnings != null and !warnings.isEmpty()}" class="alert-list">
        <div th:each="w : ${warnings}"
             th:class="'alert-row alert-row--' + ${w.warningLevel == null ? 'yellow' : #strings.toLowerCase(w.warningLevel)}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div class="alert-row__body">
                <div class="alert-row__title">
                    <span th:text="${w.warningTitle}">预警标题</span>
                    <span th:class="'badge badge--' + ${w.warningLevel == null ? 'yellow' : #strings.toLowerCase(w.warningLevel)}"
                          th:text="${w.warningLevel}">等级</span>
                </div>
                <div class="alert-row__content" th:text="${w.warningContent}">预警内容</div>
            </div>
            <div class="alert-row__time" th:text="${#temporals.format(w.startTime, 'MM-dd HH:mm')}">时间</div>
        </div>
    </div>

    <!-- 实时天气 + 7 天预报 -->
    <div th:if="${realtime != null}" class="row">
        <div class="col-12 col-lg-7">
            <div class="weather-now">
                <div class="weather-now__head">
                    <div>
                        <div class="weather-now__city">
                            <i class="bi bi-geo-alt-fill"></i>
                            <span th:text="${currentCity}">北京</span>
                        </div>
                        <div class="weather-now__date" th:text="${#temporals.format(realtime.weatherDate, 'yyyy 年 M 月 d 日')} + ' · ' + ${realtime.weatherText}">2026 年 1 月 1 日 · 晴</div>
                    </div>
                    <div>
                        <div class="weather-now__temp">
                            <span th:text="${realtime.temp != null ? #numbers.formatDecimal(realtime.temp, 1, 0) : '--'}">25</span>
                            <sup>°C</sup>
                        </div>
                        <div class="weather-now__feels">
                            体感 <span th:text="${realtime.feelsLike != null ? #numbers.formatDecimal(realtime.feelsLike, 1, 0) + '°' : '--'}">25°</span>
                        </div>
                        <div class="weather-now__actions">
                            <button th:if="${user != null}"
                                    th:attr="data-favorite-btn='1',data-city=${currentCity},data-city-code=${currentCityCode},data-logged-in='1',data-favorited=${isFavorited != null and isFavorited ? '1' : '0'}"
                                    th:class="${isFavorited != null and isFavorited ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'}">
                                <i th:class="${isFavorited != null and isFavorited ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                                <span th:text="${isFavorited != null and isFavorited ? '已收藏' : '收藏'}">收藏</span>
                            </button>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/weather/detail/{code}(code=${currentCityCode}, cityName=${currentCity})}">
                                <i class="bi bi-info-circle"></i> 详情
                            </a>
                        </div>
                    </div>
                </div>
                <div class="weather-now__metrics">
                    <div class="metric">
                        <div class="metric__label">湿度</div>
                        <div class="metric__value" th:text="${realtime.humidity != null ? realtime.humidity + '%' : '--'}">60%</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">风向</div>
                        <div class="metric__value" th:text="${realtime.windDir} ?: '—'">南风</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">风速</div>
                        <div class="metric__value" th:text="${realtime.windSpeed != null ? #numbers.formatDecimal(realtime.windSpeed, 1, 1) + ' km/h' : '--'}">10 km/h</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">气压</div>
                        <div class="metric__value" th:text="${realtime.pressure != null ? realtime.pressure + ' hPa' : '--'}">1013 hPa</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">能见度</div>
                        <div class="metric__value" th:text="${realtime.visibility != null ? #numbers.formatDecimal(realtime.visibility, 1, 1) + ' km' : '--'}">15 km</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">降水量</div>
                        <div class="metric__value" th:text="${realtime.precip != null ? #numbers.formatDecimal(realtime.precip, 1, 1) + ' mm' : '0 mm'}">0 mm</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">最高温</div>
                        <div class="metric__value metric__value--warm" th:text="${realtime.tempMax != null ? #numbers.formatDecimal(realtime.tempMax, 1, 0) + '°' : '--'}">30°</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">最低温</div>
                        <div class="metric__value metric__value--cold" th:text="${realtime.tempMin != null ? #numbers.formatDecimal(realtime.tempMin, 1, 0) + '°' : '--'}">18°</div>
                    </div>
                    <div class="metric">
                        <div class="metric__label">紫外线</div>
                        <div class="metric__value" th:text="${realtime.uvIndex != null ? realtime.uvIndex : '--'}">5</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-5">
            <div class="data-card" style="height:100%;">
                <div class="data-card-header">
                    <h4><i class="bi bi-calendar-week icon"></i>未来 7 天</h4>
                    <a class="small" th:href="@{/weather/ai-forecast/{code}(code=${currentCityCode}, cityName=${currentCity})}">详细预报 →</a>
                </div>
                <div class="forecast-list" th:if="${forecast != null and !forecast.isEmpty()}">
                    <div th:each="d, iter : ${forecast}" class="forecast-day">
                        <div class="forecast-day__date" th:text="${iter.index == 0 ? '今天' : #temporals.format(d.weatherDate, 'M/d')}">今天</div>
                        <div class="forecast-day__icon" th:text="${d.weatherText != null and #strings.contains(d.weatherText, '雨') ? '🌧' : (d.weatherText != null and #strings.contains(d.weatherText, '雪') ? '🌨' : (d.weatherText != null and #strings.contains(d.weatherText, '阴') ? '☁' : '☀'))}">☀</div>
                        <div class="forecast-day__text" th:text="${d.weatherText}">晴</div>
                        <div class="forecast-day__temp" th:text="${d.tempMax != null ? #numbers.formatDecimal(d.tempMax, 1, 0) + '°' : '--'}">28°</div>
                        <div class="forecast-day__range" th:text="${d.tempMin != null ? '↓ ' + #numbers.formatDecimal(d.tempMin, 1, 0) + '°' : ''}">↓ 18°</div>
                    </div>
                </div>
                <div th:unless="${forecast != null and !forecast.isEmpty()}" class="empty-state">暂无预报</div>
            </div>
        </div>
    </div>

    <!-- 城市卡网格（Aether 风格：紧凑、无大留白） -->
    <div class="data-card mt-3" th:if="${cityCardsJson != null}">
        <div class="data-card-header">
            <h4><i class="bi bi-grid-3x3-gap icon"></i>城市天气一览</h4>
            <a class="small" th:href="@{/weather/aether}">展开完整城市库 →</a>
        </div>
        <div class="aether-grid" id="cityGrid"></div>
    </div>

    <!-- 空状态 -->
    <div th:if="${realtime == null and weatherError == null and cityCardsJson == null}" class="empty-state">
        <i class="bi bi-cloud-sun"></i>
        <h4>搜索城市查看天气</h4>
        <p class="text-muted">在上方搜索框输入城市名称即可</p>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    WeatherApp.renderCityGrid(document.getElementById('cityGrid'), /*[[${cityCardsJson}]]*/ '[]');
</script>
</body>
</html>
