<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预警</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container mt-3">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0"><i class="bi bi-exclamation-triangle text-soft"></i> 天气预警</h3>
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>

    <form th:action="@{/weather/warning/search}" method="get" class="search-bar mb-3">
        <input class="form-control" type="text" name="city" placeholder="搜索城市" th:value="${searchCity}" required>
        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> 查询</button>
    </form>

    <div th:if="${searchError}" class="alert-row alert-row--yellow mb-3">
        <i class="bi bi-exclamation-triangle"></i>
        <div class="alert-row__body" th:text="${searchError}">未找到城市</div>
    </div>

    <div th:if="${searchCity}" class="alert-row alert-row--blue mb-3">
        <i class="bi bi-geo-alt"></i>
        <div class="alert-row__body">当前显示 <strong th:text="${searchCity}">北京</strong> 的预警信息</div>
        <a class="btn btn-sm btn-outline-primary" th:href="@{/weather/warning}">查看全部</a>
    </div>

    <div th:if="${warnings != null and !warnings.isEmpty()}" class="row">
        <div th:each="w : ${warnings}" class="col-12 col-lg-6">
            <div th:class="'alert-row alert-row--' + ${w.warningLevel == null ? 'yellow' : #strings.toLowerCase(w.warningLevel)}" style="display:block;padding:16px;">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div>
                        <span th:class="'badge badge--' + ${w.warningLevel == null ? 'yellow' : #strings.toLowerCase(w.warningLevel)}"
                              th:text="${w.warningLevel}">等级</span>
                        <span class="badge" th:text="${w.warningType}">类型</span>
                    </div>
                    <small class="text-muted text-nowrap" th:text="${#temporals.format(w.startTime, 'MM-dd HH:mm')}">时间</small>
                </div>
                <div class="alert-row__title" th:text="${w.warningTitle}">标题</div>
                <div class="alert-row__content" th:text="${w.warningContent}">内容</div>
                <div class="mt-2 d-flex flex-wrap gap-3 small text-muted">
                    <span><i class="bi bi-geo-alt"></i> <span th:text="${w.city}">城市</span></span>
                    <span th:if="${w.endTime != null}"><i class="bi bi-clock"></i> 截止 <span th:text="${#temporals.format(w.endTime, 'MM-dd HH:mm')}">时间</span></span>
                    <span><span th:class="${w.status == 1 ? 'badge badge--active' : 'badge badge--closed'}" th:text="${w.status == 1 ? '生效中' : '已解除'}">状态</span></span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${warnings == null or warnings.isEmpty()}" class="empty-state">
        <i class="bi bi-shield-check"></i>
        <h4>当前暂无活跃预警</h4>
        <p class="text-muted" th:if="${searchCity}"><span th:text="${searchCity}">北京</span> 当前无预警</p>
        <p class="text-muted" th:unless="${searchCity}">系统未检测到任何生效预警</p>
    </div>

</main>

<div th:replace="fragments :: footer"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
