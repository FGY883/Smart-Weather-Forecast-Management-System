<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预警 - 智能天气预报系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        /* 预警页专用：等级色带、紧凑展示 */
        .warn-strip { height: 4px; }
        .level-Red     { --lv: #d63031; --lv-bg: #ffe3e3; --lv-text: #fff; }
        .level-Orange  { --lv: #e17055; --lv-bg: #ffe9e0; --lv-text: #fff; }
        .level-Yellow  { --lv: #fdcb6e; --lv-bg: #fff5d6; --lv-text: #1a1f2c; }
        .level-Blue    { --lv: #74b9ff; --lv-bg: #e3f1ff; --lv-text: #fff; }
        .level-White   { --lv: #b2bec3; --lv-bg: #f1f3f5; --lv-text: #1a1f2c; }
        .warn-card { border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; overflow: hidden; }
        .warn-card .warn-strip { background: var(--lv); }
        .warn-card .level-badge {
            background: var(--lv); color: var(--lv-text);
            padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 600;
        }
        .warn-field { font-size: 13px; color: #4a5365; }
        .warn-field b { color: #1a1f2c; font-weight: 500; margin-right: 4px; }
        .warn-divider { height: 1px; background: #f0f2f5; margin: 12px 0; }
        .warn-text { white-space: pre-wrap; line-height: 1.7; color: #1a1f2c; font-size: 14px; }
        .city-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 6px;
            background: #fff; transition: border-color .15s;
        }
        .city-row:hover { border-color: #1f5fa8; }
        .city-row .city-name { font-weight: 500; color: #1a1f2c; }
        .empty-state { padding: 48px 16px; text-align: center; color: #8993a4; }
        .api-tag { font-size: 11px; color: #1f5fa8; background: #e8f0fb; padding: 2px 8px; border-radius: 4px; }
        .hot-city-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; border: 1px solid #e5e7eb; border-radius: 20px;
            background: #fff; color: #1a1f2c; text-decoration: none;
            font-size: 14px; transition: all .15s;
        }
        .hot-city-btn:hover { border-color: #1f5fa8; color: #1f5fa8; background: #f6f9fd; }
        details.warn-details { margin-top: 8px; }
        details.warn-details summary {
            cursor: pointer; font-size: 13px; color: #1f5fa8;
            list-style: none; padding: 4px 0;
        }
        details.warn-details summary::before { content: '▸ '; }
        details.warn-details[open] summary::before { content: '▾ '; }
        details.warn-details pre {
            background: #f5f6f8; padding: 10px 12px; border-radius: 4px;
            font-size: 12px; max-height: 220px; overflow: auto;
            white-space: pre-wrap; word-break: break-all; color: #4a5365;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 导航栏 -->
    <div th:replace="fragments :: navbar"></div>

    <main class="container mt-4">

        <!-- 页头 -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="mb-1">
                    <i class="bi bi-exclamation-triangle text-warning me-2"></i>天气预警
                </h3>
                <div class="text-muted small">
                    数据来源
                    <span class="api-tag">华风爱科 /alerts/v1</span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回首页
                </a>
            </div>
        </div>

        <!-- 搜索 -->
        <form th:action="@{/weather/warning/search}" method="get" class="mb-4">
            <div class="input-group">
                <span class="input-group-text bg-white">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control" name="city"
                       placeholder="输入城市（如 北京 / 上海 / 深圳）"
                       th:value="${searchCity}" required>
                <button class="btn btn-warning" type="submit">
                    <i class="bi bi-exclamation-triangle me-1"></i>查询预警
                </button>
                <a th:if="${searchCity != null}" th:href="@{/weather/warning}"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-list me-1"></i>回到热门城市
                </a>
            </div>
        </form>

        <!-- 错误提示 -->
        <div th:if="${searchError}" class="alert alert-warning d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${searchError}">未找到城市</span>
        </div>

        <!-- ============ 默认页：热门城市快捷入口 ============ -->
        <div th:if="${searchCity == null}">
            <h5 class="mb-3">
                <i class="bi bi-geo-alt me-1"></i>热门城市
                <span class="text-muted small ms-2">（点击直接查询该城市预警）</span>
            </h5>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a th:each="c : ${hotCities}"
                   th:href="@{/weather/warning/search(city=${c})}"
                   class="hot-city-btn text-decoration-none">
                    <i class="bi bi-geo-alt-fill text-danger"></i>
                    <span th:text="${c}">北京</span>
                </a>
            </div>
            <div class="empty-state">
                <i class="bi bi-broadcast" style="font-size:3rem;color:#1f5fa8;"></i>
                <h5 class="mt-3 mb-1">输入城市名，查询实时灾害预警</h5>
                <p class="text-muted mb-0">支持台风、暴雨、暴雪、寒潮、大风、高温、雷电等预警类型。</p>
            </div>
        </div>

        <!-- ============ 搜索结果：城市级预警详情 ============ -->
        <div th:if="${searchCity != null}">
            <!-- 顶部状态条 -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0">
                    <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                    <span th:text="${searchCity}">北京</span>
                    <span class="text-muted ms-2 small">预警详情</span>
                </h5>
                <div>
                    <span class="api-tag me-2" th:text="${warnings != null ? warnings.size() + ' 条' : '0 条'}">0 条</span>
                    <a th:href="@{/weather/warning}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>返回热门城市
                    </a>
                </div>
            </div>

            <!-- 详情卡片列表 -->
            <div th:if="${warnings != null and !warnings.isEmpty()}" class="row g-3">
                <div th:each="w : ${warnings}" class="col-12">
                    <div class="warn-card"
                         th:classappend="${'level-' + (w['level'] != null ? w['level'] : 'Blue')}">
                        <div class="warn-strip"></div>
                        <div class="p-3">
                            <!-- 头部：等级 + 类型 -->
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                    <span class="level-badge"
                                          th:text="${w['levelName'] != null ? w['levelName'] + '预警' : '预警'}">蓝色预警</span>
                                    <span class="badge bg-light text-dark border" th:if="${w['typeName'] != null}">
                                        <i class="bi bi-tag me-1"></i>
                                        <span th:text="${w['typeName']}">高温</span>
                                    </span>
                                </div>
                            </div>
                            <!-- 标题 -->
                            <h5 class="mb-2" th:text="${w['title'] != null ? w['title'] : '气象预警'}">气象预警</h5>
                            <!-- 正文 -->
                            <div class="warn-text mb-3"
                                 th:text="${w['text'] != null ? w['text'] : '暂无预警内容'}">
                                预计未来 24 小时 ...
                            </div>

                            <!-- 元数据 -->
                            <div class="row g-2 mb-2">
                                <div class="col-12 col-md-6 warn-field" th:if="${w['sender'] != null}">
                                    <i class="bi bi-megaphone me-1 text-muted"></i>
                                    <b>发布机构：</b><span th:text="${w['sender']}">气象台</span>
                                </div>
                                <div class="col-12 col-md-6 warn-field" th:if="${w['areaName'] != null}">
                                    <i class="bi bi-geo-alt me-1 text-muted"></i>
                                    <b>影响区域：</b><span th:text="${w['areaName']}">--</span>
                                </div>
                                <div class="col-12 col-md-6 warn-field" th:if="${w['startTime'] != null}">
                                    <i class="bi bi-play me-1 text-muted"></i>
                                    <b>生效起：</b><span th:text="${w['startTime']}">--</span>
                                </div>
                                <div class="col-12 col-md-6 warn-field" th:if="${w['endTime'] != null}">
                                    <i class="bi bi-stop me-1 text-muted"></i>
                                    <b>生效止：</b><span th:text="${w['endTime']}">--</span>
                                </div>
                                <div class="col-12 warn-field" th:if="${w['summary'] != null}">
                                    <i class="bi bi-card-text me-1 text-muted"></i>
                                    <b>摘要：</b><span th:text="${w['summary']}">--</span>
                                </div>
                            </div>

                            <!-- 完整 JSON（用于调试/作业展示） -->
                            <details class="warn-details">
                                <summary>查看原始 API 响应</summary>
                                <pre th:text="${#strings.toString(w)}">{}</pre>
                            </details>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 空态 -->
            <div th:if="${warnings == null or warnings.isEmpty()}" class="empty-state">
                <i class="bi bi-shield-check" style="font-size:3rem;color:#2f855a;"></i>
                <h5 class="mt-3 mb-1" style="color:#2f855a;">
                    <span th:text="${searchCity}">北京</span> 当前暂无活跃预警
                </h5>
                <p class="text-muted mb-0">该地区天气状况良好，请放心出行。</p>
            </div>
        </div>

    </main>

    <div th:replace="fragments :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
