<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<main class="container">
    <div class="auth-card">
        <h2>登录</h2>
        <div class="subtitle">智能天气预报系统</div>

        <div th:if="${errorMsg}" class="alert-row alert-row--red mb-3">
            <i class="bi bi-exclamation-circle"></i>
            <div class="alert-row__body" th:text="${errorMsg}">错误</div>
        </div>
        <div th:if="${successMsg}" class="alert-row alert-row--blue mb-3">
            <i class="bi bi-check-circle"></i>
            <div class="alert-row__body" th:text="${successMsg}">成功</div>
        </div>
        <div th:if="${param.locked != null}" class="alert-row alert-row--red mb-3">
            <i class="bi bi-lock"></i>
            <div class="alert-row__body">登录失败次数过多，账号已临时锁定，请稍后再试</div>
        </div>

        <form th:action="@{/doLogin}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input class="form-control form-control-lg" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input class="form-control form-control-lg" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit">
                <i class="bi bi-box-arrow-in-right"></i> 登 录
            </button>
        </form>

        <div class="text-center mt-3 small text-soft">
            还没有账号？ <a th:href="@{/register}">立即注册</a>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
